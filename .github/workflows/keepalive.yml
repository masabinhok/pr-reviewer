# Keeps the demo API on Render's free plan awake. It sleeps after 15 minutes without traffic
# and takes about a minute to wake, while GitHub gives a webhook 10 seconds and never retries
# it. GET / touches neither Postgres nor Redis, so it doesn't keep Neon awake too.
# Set the repository variable DEMO_API_URL (e.g. https://pr-reviewer-api.onrender.com).
name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.DEMO_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$DEMO_API_URL/"
        env:
          DEMO_API_URL: ${{ vars.DEMO_API_URL }}
