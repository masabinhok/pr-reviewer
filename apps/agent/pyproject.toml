[project]
name = "pr-agent"
version = "0.1.0"
description = "The review agent for pr-reviewer: a LangGraph agent behind a FastAPI endpoint."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx2==2.12.0",  # the anthropic SDK's HTTP client; also used here to download tarballs
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Raised inside Starlette's test client, not by this project.
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
